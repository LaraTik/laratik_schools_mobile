org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation: this project lives on a different
# volume (D:) from the pub cache (C:), and Kotlin 2.1.0's incremental cache
# crashes on cross-volume relative paths. Re-enable once both are on the same
# volume or Kotlin fixes the cross-volume file-relative issue.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
