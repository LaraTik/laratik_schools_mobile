name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pin-version:
    name: Extract pinned Flutter version
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pin
        name: Read .fvmrc
        run: |
          if [ ! -f .fvmrc ]; then
            echo "::error::Missing .fvmrc. This repo uses FVM (see docs/adr/0006)."
            exit 1
          fi
          version=$(jq -r '.flutter' .fvmrc)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::.fvmrc did not declare a flutter version."
            exit 1
          fi
          echo "Pinned Flutter version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  static-and-test:
    name: Flutter analyze + test (pinned via .fvmrc)
    needs: pin-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq (for FVM pin + drift check)
        run: sudo apt-get install -y jq

      - name: Setup Flutter (version from .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.pin-version.outputs.version }}
          channel: stable
          cache: true

      - name: Assert installed Flutter matches the FVM pin
        run: |
          expected=$(jq -r '.flutter' .fvmrc)
          actual=$(flutter --version | head -n 1 | awk '{print $2}')
          if [ "$expected" != "$actual" ]; then
            echo "::error::Installed Flutter $actual does not match .fvmrc pin $expected."
            exit 1
          fi
          echo "Flutter $actual matches the FVM pin."

      - name: Install dependencies
        run: flutter pub get

      - name: Verify BACKEND_CONTRACT_SHA matches the sibling repo
        run: |
          expected=$(cat BACKEND_CONTRACT_SHA)
          actual=$(git -C ../laratik_schools rev-parse HEAD)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Backend contract drift detected."
            echo "  pinned:   $expected"
            echo "  actual:   $actual"
            echo "Update BACKEND_CONTRACT_SHA after regenerating contracts/dart."
            exit 1
          fi
          echo "Backend contract SHA matches: $expected"

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

  contract-drift:
    name: Backend contract drift check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Check that the sibling laratik_schools repo exists
        run: |
          if [ ! -d "../laratik_schools" ]; then
            echo "::error::Sibling laratik_schools repo not found at ../laratik_schools."
            exit 1
          fi
          echo "Sibling laratik_schools repo present at $(realpath ../laratik_schools)."

      - name: Verify pinned SHA matches the sibling repo
        run: |
          expected=$(cat BACKEND_CONTRACT_SHA)
          actual=$(git -C ../laratik_schools rev-parse HEAD)
          echo "Expected (pinned in BACKEND_CONTRACT_SHA): $expected"
          echo "Actual   (sibling laratik_schools HEAD):   $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Drift detected. Update BACKEND_CONTRACT_SHA and regenerate contracts/dart."
            exit 1
          fi
