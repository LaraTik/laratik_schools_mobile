name: laratik_schools_mobile
description: Greenfield Flutter mobile app for the Laratik Schools platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Generated v1 contract client from the laratik_schools backend.
  # Pinned by the BACKEND_CONTRACT_SHA file; CI fails on drift.
  laratik_schools_api:
    path: ../laratik_schools/contracts/dart

  # Routing + state (provisional; locked in via ADR after the Phase 0 spike).
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional plumbing (Result<T, E> defined in lib/core/result.dart).
  equatable: ^2.0.5
  meta: ^1.16.0

  # Platform — networking, crypto, prefs, device info, system browser.
  http: ^1.2.2
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  uuid: ^4.5.1
  url_launcher: ^6.3.0
  # Secure storage for OAuth tokens. Backed by Android Keystore +
  # EncryptedSharedPreferences. The access / refresh tokens live here;
  # the non-secret session metadata (installation id, roles, scopes,
  # expires_at) stays in plain SharedPreferences. iOS uses the
  # Keychain; tests fall back to an in-memory implementation.
  flutter_secure_storage: ^9.2.4
  # In-app WebView for the OAuth flow. Chrome Custom Tabs runs in
  # Chrome's process and inherits Chrome's network-security policy
  # (which blocks cleartext HTTP to 10.0.2.2 on Android 9+). Doing the
  # OAuth round-trip in our own WebView lets the dev flavor's
  # network_security_config.xml do its job and keeps the redirect
  # interception under app control. The intent filter for
  # `laratik://oauth/callback` is still registered in AndroidManifest
  # for deep links from outside the WebView (e.g. email magic links).
  # Pin to 4.x; the 5.x major has not been released yet at the time
  # of this writing, so we re-evaluate when 5.0.0 lands.
  webview_flutter: ^4.13.1

  # Internationalization.
  intl: 0.20.2 # direct pin required by project (Flutter 3.35.7 / flutter_localizations)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Enable the ARB-driven localization pipeline. The ARB files
  # live in `lib/l10n/`; `flutter gen-l10n` (run via
  # `flutter pub get`) generates the typed `AppLocalizations`
  # class under `.dart_tool/flutter_gen/gen_l10n/`. See
  # `l10n.yaml` for the generator config.
  generate: true
